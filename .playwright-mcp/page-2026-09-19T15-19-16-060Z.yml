      - article [ref=f1e181]:
        - paragraph [ref=f1e182]:
          - text: Xninetzy is a
          - strong [ref=f1e183]: local-first, MCP-native Personal Intelligence and Learning system
          - text: ". It exposes one MCP interface that connects a host (Claude, Claude Code, Cursor, any other MCP-compatible client) to a shared engine: router, planner, source registry, cache, deduplication, entity-resolution, evidence, citation, and security."
        - paragraph [ref=f1e184]: There is no second product surface. No REST API, no GraphQL, no CLI as a parallel client, no web dashboard. The MCP server (stdio primary, Streamable HTTP secondary, loopback-bound by default) is the only external interface.
        - blockquote [ref=f1e185]:
          - paragraph [ref=f1e186]:
            - strong [ref=f1e187]: "What Xninetzy is NOT:"
            - text: not an internet-ready multi-tenant SaaS, not an autonomous server-side agent that acts on its own, not a replacement for vault backups or an LMS, not a scraped-data aggregator of walled-garden job boards. Reasoning, planning, and orchestration belong to the host.
        - heading "Domains shipped in v2.2.0" [level=2] [ref=f1e188]
