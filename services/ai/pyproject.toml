[project]
name = "xninetzy-ai"
version = "0.1.0"
description = "FastAPI AI service for Xninetzy AI WhatsApp bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
    "langchain-core>=0.3",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.4",
    "playwright>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "numpy>=2.4.6",
    "faiss-cpu>=1.8",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pillow>=10.0",
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
    "cryptography>=43.0",
    "langchain-anthropic>=1.5.2",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
