services:
  xninetzy:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATA_DIR: /app/data
      SQLITE_PATH: /app/data/xninetzy.sqlite3
      BACKUP_DIR: /app/data/backups
      VECTOR_DATA_DIR: /app/data/vector
      GRAPH_VECTOR_DATA_DIR: /app/data/graph_vector
      WEB_ANALYSIS_DATA_DIR: /app/data/web-analysis
      HEBAT_DATA_DIR: /app/data/hebat
      HEBAT_DOWNLOAD_DIR: /app/data/hebat/downloads
      XNINETZY_SKILLS_DIR: /app/data/opencode-config/opencode/skills
      MCP_RUNTIME_MODE: container
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      XNINETZY_DEVICE: cpu
      EMBEDDING_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: void
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "${AI_CPU_THREADS:-4}"
      MKL_NUM_THREADS: "${AI_CPU_THREADS:-4}"
      TORCH_NUM_THREADS: "${AI_CPU_THREADS:-4}"
      AI_CPU_THREADS: "${AI_CPU_THREADS:-4}"
      XDG_CONFIG_HOME: /app/data/opencode-config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
      - ${OBSIDIAN_VAULT_HOST_PATH:?Set OBSIDIAN_VAULT_HOST_PATH}:/app/obsidian-vault:ro
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    profiles:
      - graph
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    secrets:
      - neo4j_auth
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

secrets:
  neo4j_auth:
    file: ./.secrets/neo4j_auth

volumes:
  neo4j-data:
  neo4j-logs:
