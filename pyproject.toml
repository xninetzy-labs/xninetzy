[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "xninetzy-mcp"
version = "1.0.0"
description = "Xninetzy MCP server — local-first, MCP-only Personal Intelligence and Learning system."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Xninetzy-Source-Available-2.2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "fastmcp", "obsidian", "hebat", "academic", "knowledge", "local-first"]
authors = [
    { name = "Misbahul Muttaqin", email = "misbahul45@users.noreply.github.com" },
]
maintainers = [
    { name = "Xninetzy Labs" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
    "langchain-core>=0.3",
    "playwright>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "numpy>=2.4.6",
    "faiss-cpu>=1.8",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pillow>=10.0",
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "cryptography>=43.0",
    "mcp>=1.28.1,<2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "neo4j>=5.26",
    "networkx>=3.3",
    "ddgs>=6.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
]
neo4j = [
    "neo4j>=5.26",
]
torch-cpu = []

[project.urls]
Homepage = "https://github.com/xninetzy-labs/xninetzy"
Repository = "https://github.com/xninetzy-labs/xninetzy"
Issues = "https://github.com/xninetzy-labs/xninetzy/issues"
Documentation = "https://xninetzy.vercel.app/docs/"
"MCP Reference" = "https://xninetzy.vercel.app/docs/mcp-system/"

[project.scripts]
xninetzy = "xninetzy.cli.supervisor:main"
xninetzy-cli = "xninetzy.cli.orchestrator:main"

[tool.hatch.build.targets.wheel]
packages = ["xninetzy"]
include = [
    "xninetzy/**/*.py",
    "xninetzy/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "xninetzy",
    "README.md",
    "LICENSE",
    "scripts",
    "tests",
    "docs",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "integration: heavier tests that may download models or hit the network",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "apps/docs/dist", "apps/docs/.astro"]
