        - heading "Design principles" [level=2] [ref=f1e252]
        - heading "Local-first and single-owner" [level=3] [ref=f1e253]
        - paragraph [ref=f1e254]: The default configuration targets one owner on a local machine or private network. SQLite, FAISS, HEBAT browser profiles, media, and Obsidian vault stay local. There is no Xninetzy-operated service anywhere in the default path.
        - heading "MCP is the only public interface" [level=3] [ref=f1e255]
        - paragraph [ref=f1e256]:
          - text: Clients connect via
          - code [ref=f1e257]: stdio
          - text: (primary) or Streamable HTTP (opt-in, loopback by default). The MCP server injects trusted identity context. Client-supplied
          - code [ref=f1e258]: sender_id
          - text: ","
          - code [ref=f1e259]: sender_name
          - text: ", and"
          - code [ref=f1e260]: chat_id
          - text: values are never authorization evidence.
        - heading "No server-side agent loop" [level=3] [ref=f1e261]
        - paragraph [ref=f1e262]: Xninetzy exposes capabilities. It does not decide what to do next, does not chain its own tool calls autonomously, and does not act as a second brain. Reasoning and orchestration belong to the host (Claude / Claude Code / Cursor / etc.).
        - heading "Human in the loop" [level=3] [ref=f1e263]
        - paragraph [ref=f1e264]:
          - code [ref=f1e265]: FINAL
          - text: "-class tools (e.g."
          - code [ref=f1e266]: improvement_approve
          - text: ","
          - code [ref=f1e267]: portal_krs_final_submit
          - text: ) require HITL approval server-side. Orchestrator tier gate (
          - code [ref=f1e268]: _effective_tier
          - text: ) rejects owner-supplied tier downgrade of FINAL tools.
        - heading "Capture before commitment" [level=3] [ref=f1e269]
        - paragraph [ref=f1e270]: The OS Inbox holds ambiguous input until its next action is clear. Promotion to a task or archive runs in one transaction (task + entity link + state transition + event). Reusing an idempotency key never creates a second row.
        - heading "Provider freedom" [level=3] [ref=f1e271]
        - paragraph [ref=f1e272]:
          - text: LLM providers are pluggable. Flaz is the default, not a lock-in. Optional backends (Neo4j, Graphiti, Ollama) are opt-in via a
          - code [ref=f1e273]: ProviderAdapter
          - text: interface, never a hard dependency.
