name: publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0.0). Leave blank to read from pyproject.toml.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Sync
        run: uv sync --all-extras
      - name: Quality gates
        run: |
          uv run ruff check xninetzy tests scripts
          uv run python -m xninetzy.cli.supervisor release-check
          uv run --no-project python scripts/mcp_audit.py --strict
      - name: Verify version
        id: verify_version
        run: |
          PKG_VERSION="$(uv run --no-project python -c 'import tomllib, sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG="${GITHUB_REF_NAME}"
          echo "pyproject_version=$PKG_VERSION"
          echo "tag=$TAG"
          if [ -n "${{ inputs.version }}" ]; then
            WANTED="${{ inputs.version }}"
            echo "manual override=$WANTED"
            if [ "$WANTED" != "$PKG_VERSION" ]; then
              echo "::error::manual override ($WANTED) does not match pyproject.toml version ($PKG_VERSION)"
              exit 1
            fi
          fi
          if [[ "$TAG" != "v"* ]]; then
            echo "::error::tag must start with 'v', got $TAG"
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ($TAG) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Show artifacts
        run: ls -la dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xninetzy-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xninetzy-dist
          path: dist/
      - name: Verify download
        run: ls -la dist/
      - name: Publish
        run: uv publish --trusted-publishing always

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xninetzy-dist
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  mirror:
    name: Mirror origin -> public
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add public remote
        run: git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/misbahul45/xninetzy.git
      - name: Push main + tags to public
        run: |
          git fetch --prune --tags origin
          git push public origin/main:main
          git push public --tags
