services:
  ai:
    build:
      context: ./services/ai
    env_file:
      - .env
    # Match host ownership so MCP host and Docker share writable data/vault files.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # AI, WA and CLI use distinct host ports; Flaz is reached over HTTPS.
    network_mode: host
    environment:
      WA_MCP_BASE_URL: http://127.0.0.1:8081
    volumes:
      - ./services/ai/data:/app/data
      - ${OBSIDIAN_VAULT_HOST_PATH:?Set OBSIDIAN_VAULT_HOST_PATH}:/app/obsidian-vault
      - wa-media:/app/data/wa-media      # shared with wa-enggine for media download
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  wa-enggine:
    build:
      context: ./services/wa-enggine
    env_file:
      - .env
    network_mode: host
    environment:
      WA_AUTH_DIR: /app/sessions
      AI_BASE_URL: http://127.0.0.1:8000
      AI_API_URL: http://127.0.0.1:8000
      AI_CHAT_ENDPOINT: /api/chat
      AI_TIMEOUT_MS: "120000"
      MCP_SERVER_ENABLED: "true"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8081"
      WA_PAIRING_WAIT_MS: "90000"
      WA_PAIRING_RECONNECT_DELAY_MS: "30000"
      WA_GROUP_TRIGGER_MODE: mention_or_prefix
      WA_COMMAND_PREFIX: "!"
      WA_MEDIA_DIR: /app/data/wa-media
      WA_MEDIA_MAX_BYTES: "26214400"
      WA_PROCESSING_DIR: /app/sessions/processing
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - wa-session:/app/sessions
      - wa-media:/app/data/wa-media      # shared with ai service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  cli:
    build:
      context: ./apps/cli
    env_file:
      - .env
    profiles:
      - tools
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      XNINETZY_AI_URL: http://127.0.0.1:8000
      XNINETZY_CLI_TIMEOUT_MS: "120000"

volumes:
  wa-media:
  wa-session:
