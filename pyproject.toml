[project]
name = "xninetzy-mcp"
version = "2.2.0"
description = "Xninetzy MCP server — Model Context Protocol AI service (MCP-only pivot)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
    "langchain-core>=0.3",
    "playwright>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "numpy>=2.4.6",
    "faiss-cpu>=1.8",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pillow>=10.0",
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "cryptography>=43.0",
    "mcp>=1.28.1,<2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "neo4j>=5.26",
    "networkx>=3.3",
    "ddgs>=6.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
xninetzy-cli = "xninetzy.cli.orchestrator:main"
xninetzy = "xninetzy.cli.supervisor:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xninetzy"]

[tool.uv]
package = true

# CPU-only PyTorch. Pinning torch to the official CPU wheel index keeps the
# resolver off the default PyPI torch build, which on linux drags in the entire
# CUDA stack (triton + nvidia-* ≈ several GB). sentence-transformers inherits
# this CPU torch instead of resolving its own CUDA one.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "integration: heavier tests that may download models or hit the network",
]
