name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest + release-check + mcp_audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Sync
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check xninetzy tests scripts
      - name: Pytest (tools + manifest + release)
        run: uv run --no-project pytest -ra tests/tools
      - name: Release gate
        run: uv run python -m xninetzy.cli.supervisor release-check
      - name: MCP audit (strict)
        run: uv run --no-project python scripts/mcp_audit.py --strict

  docs:
    name: Documentation (yarn check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/docs/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn check
      - run: yarn build
