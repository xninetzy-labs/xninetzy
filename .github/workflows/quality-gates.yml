name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest + release-check + mcp_audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Sync
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest (tools and critical execution contracts)
        env:
          AUTO_MEMORY_ENABLED: 'false'
          AUTO_GRAPH_ENABLED: 'false'
          AUTO_IMPROVE_ENABLED: 'false'
          NEO4J_ENABLED: 'false'
          NEO4J_AUTOSTART_ENABLED: 'false'
        run: >-
          uv run --no-project pytest -ra tests/tools tests/cli tests/db/test_idempotency_store.py
          tests/interfaces/test_mcp_runtime.py tests/invocation tests/policy tests/orchestrator
          tests/reasoning/test_reasoning_depth.py tests/os/lightning/test_input_redaction.py
          tests/core/test_secret_redaction.py tests/architecture/test_minimal_dependencies.py
          tests/governance/test_prompt_contract.py tests/governance/test_skill_frontmatter.py
          tests/os/skills/test_skills.py tests/workflow tests/os/graph tests/os/hitl tests/os/backup
          tests/os/knowledge/test_embedding_dimensions.py tests/media/video/test_storage_roundtrip.py
          tests/test_routing_taxonomy.py tests/architecture/test_container_deployment.py
          tests/interfaces/test_execution_boundary.py tests/interfaces/test_transport_authority.py
          tests/interfaces/test_graph_lifespan.py
          tests/interfaces/test_skill_validation_policy.py
          tests/governance/test_execution_authority.py tests/os/lightning/test_patch_executor.py
          tests/interfaces/test_mcp_tool_adapter.py tests/interfaces/test_trust_injection.py
          tests/core/test_output_sanitization.py
          tests/os/policy/test_action_policy.py tests/os/notifications/test_admin_notifier.py
          tests/os/academic/hebat/test_hebat_direct_admin_approval.py
          tests/os/academic/hebat/test_hebat_upload_flow.py
          tests/os/academic/test_qa_portal_tools.py tests/os/academic/test_krs_war_tools.py
      - name: Opt-in MCP graph worker and FAISS restart (offline)
        run: uv run --no-project python scripts/smoke_graph_worker.py
      - name: Canonical prompt integrity
        run: uv run --no-project python scripts/validate_prompt_contract.py
      - name: Release gate
        run: uv run python -m xninetzy.cli.supervisor release-check
      - name: MCP audit (strict)
        run: uv run --no-project python scripts/mcp_audit.py --strict

  minimal:
    name: Minimal installed wheel (no optional services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install frozen base package
        run: uv sync --frozen --no-dev --no-editable --reinstall-package xninetzy-mcp
      - name: Installed package matches source
        run: .venv/bin/python -I scripts/check_installed_package.py --source xninetzy
      - name: Smoke installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import asyncio
          import os
          import sys
          import tempfile
          from pathlib import Path

          root = Path(tempfile.mkdtemp(prefix="xn-minimal-"))
          os.environ.update(
              MCP_RUNTIME_MODE="container", DATA_DIR=str(root),
              SQLITE_PATH=str(root / "smoke.sqlite3"), LIGHTNING_ENABLED="false",
              AUTO_MEMORY_ENABLED="false", AUTO_GRAPH_ENABLED="false",
              AUTO_IMPROVE_ENABLED="false", NEO4J_ENABLED="false",
              NEO4J_AUTOSTART_ENABLED="false",
          )
          import xninetzy
          assert Path(xninetzy.__file__).resolve().is_relative_to(Path(sys.prefix))
          from xninetzy.core.config import Settings, get_settings
          Settings.model_config["env_file"] = None
          get_settings.cache_clear()
          from xninetzy.interfaces.mcp_server import mcp, EXPOSED_XNINETZY_TOOLS
          from xninetzy.tools.registry import get_tool_names

          async def smoke():
              tools = await mcp.list_tools()
              assert {tool.name for tool in tools} == set(get_tool_names())
              assert set(EXPOSED_XNINETZY_TOOLS) == set(get_tool_names())
              result = await mcp.call_tool("datetime_now", {})
              assert "Sekarang:" in str(result) and "ISO:" in str(result)
              print(f"Minimal installed wheel: {len(tools)} tools; safe read passed")

          asyncio.run(smoke())
          PY
      - name: Durable workflow recovery over MCP
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_workflow_recovery.py"'
      - name: Online snapshot and offline restore over MCP
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_backup_restore.py"'

  graph:
    name: Optional Neo4j projection (isolated backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install frozen graph-only profile
        run: uv sync --frozen --no-dev --no-editable --extra graph --reinstall-package xninetzy-mcp
      - name: Installed package matches source
        run: .venv/bin/python -I scripts/check_installed_package.py --source xninetzy
      - name: Pull the existing supported official backend
        run: docker pull neo4j:5.26-community
      - name: Projection outage and recovery
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_graph_projection.py"'

  docs:
    name: Documentation (Astro check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/docs/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn run check
      - run: yarn build
